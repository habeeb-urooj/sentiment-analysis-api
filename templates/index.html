<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sentiment Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>🤖 AI Sentiment Analyzer</h1>

        <p class="subtitle">
    Analyze the sentiment of movie reviews using Machine Learning.
    </p>
        <textarea id="review" placeholder="Write your movie review here... (e.g. 'This movie was amazing!')"></textarea>

        <button id="predictBtn" onclick="predictSentiment()">
            Analyze Sentiment
        </button>
        <div id="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <div id="result"></div>
    </div>

    <script src="/static/script.js"></script>

</body>
</html>
